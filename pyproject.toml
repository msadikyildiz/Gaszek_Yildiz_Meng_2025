[project]
name = "tem1-epistasis"
version = "1.0.0"
description = "TEM-1 beta-lactamase epistasis analysis pipeline"
requires-python = ">=3.10,<3.15"

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "lightgbm",
    "polars",
    "pyarrow",
    "tqdm",
    "shap",
    "logomaker",
    "openpyxl",
    "jupyterlab",
    "ipykernel",
    "ipywidgets",
    "torch",
    "fastexcel>=0.7",
    "altair>=5.4",
    "vl-convert-python",
    "joypy>=0.2.6",
]

# Optional: only needed to re-run the Supplementary Fig S2 MIC-estimation notebook
# (si_figures/s02_mic/). Install with `uv sync --extra si-figures`.
[project.optional-dependencies]
si-figures = [
    "plategig @ git+https://github.com/msadikyildiz/plategig",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
