[project]
name = "tem1-epistasis"
version = "1.0.0"
description = "TEM-1 beta-lactamase epistasis analysis pipeline"
requires-python = ">=3.10,<3.15"

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "lightgbm",
    "polars",
    "pyarrow",
    "tqdm",
    "shap",
    "logomaker",
    "openpyxl",
    "jupyterlab",
    "ipykernel",
    "ipywidgets",
    "torch",
    "fastexcel>=0.7",
    "altair>=5.4",
    "vl-convert-python",
    "joypy>=0.2.6",
    "plotly>=5.0",
]

# Optional: only needed to re-run the Supplementary Fig S2 MIC-estimation notebook
# (si_figures/s02_mic/). REQUIRES Python >= 3.12 (plategig's floor); the extra below is
# marked python_version >= '3.12', so on a 3.10/3.11 interpreter it resolves to nothing.
# Install under a 3.12+ interpreter (see .python-version): `uv sync --extra si-figures`.
[project.optional-dependencies]
si-figures = [
    # Pinned to the plategig `biohpc` branch commit: the exact API the S2 MIC
    # notebook was written against (the default `main` branch has a different,
    # incompatible API - it lacks convert_OD_plate_to_long / plot_single_plate_media_only_wells).
    "plategig @ git+https://github.com/msadikyildiz/plategig@2d9e7d9b611c1b0d3a00af32176758bd546bd9b1 ; python_version >= '3.12'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
